[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "katta-qirgin-rag"
version = "0.2.0"
description = "O'zbek tilidagi hujjatlar uchun lokal, offline RAG (TF-IDF + SQLite)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["scikit-learn>=1.3"]

[project.optional-dependencies]
parse = ["docling-parse>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
rag = "rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
